spring.application.name=auditoria-hallazgos

# Base de datos en memoria (H2). El contenido se pierde al detener la aplicacion.
spring.datasource.url=jdbc:h2:mem:auditoria;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Consola de H2 disponible en http://localhost:8080/h2-console
spring.h2.console.enabled=true
